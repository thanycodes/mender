name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    # A throwaway Postgres for the database tests, same version as docker-compose.yml.
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: mender
          POSTGRES_PASSWORD: mender
          POSTGRES_DB: mender_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U mender"
          --health-interval 2s
          --health-timeout 3s
          --health-retries 15
    env:
      TEST_DATABASE_URL: postgresql+psycopg://mender:mender@localhost:5432/mender_test
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
      - name: Install dependencies
        run: uv sync --locked
      - name: Lint
        run: uv run ruff check .
      - name: Test
        run: uv run pytest
